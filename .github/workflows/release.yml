# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, builds and checks the site, packs it and creates the tag vVERSION with a GitHub
# release (azentrius-website-VERSION.tar.gz, SHA256SUMS, signed build provenance, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: the version in package.json)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # tag and release
      id-token: write       # signing the build provenance
      attestations: write   # storing the build provenance
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the version and its changelog section
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(node -p "require('./package.json').version")
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$version\" is not a version like 0.1.0."
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from package.json ($code). Change package.json first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          if ! node scripts/release-notes.mjs "$version" --require-date > /dev/null; then
            echo "::error::CHANGELOG.md has no dated section \"## $version – YYYY-MM-DD\"."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # This job can write releases and sign the provenance: install without running package scripts.
      - name: Build, check and pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm run build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) npm run pack

      - name: Build provenance for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/azentrius-website-${{ steps.version.outputs.version }}.tar.gz

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" --require-date > notes.md
          {
            echo
            echo "### Check"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify azentrius-website-$VERSION.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/azentrius-website-$VERSION.tar.gz" build/SHA256SUMS \
            --target "$GITHUB_SHA" --title "azentrius.com $VERSION" --notes-file notes.md
