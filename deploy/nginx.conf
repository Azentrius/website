# azentrius.com on public-host: /etc/nginx/sites-available/azentrius.com, installed by deploy/setup.sh.
# azentrius.de and www.azentrius.de redirect here (their own site, not part of this repository).
server {
    listen 80;
    listen [::]:80;
    server_name azentrius.com www.azentrius.com;
    access_log /var/log/nginx/azentrius.com.access.log anonymized;
    log_not_found off;

    # Certificate renewal (certbot webroot); not the website's folder.
    location /.well-known/acme-challenge/ {
        root /var/www/azentrius.com;
    }

    location / {
        return 301 https://azentrius.com$request_uri;
    }
}

# www.azentrius.com -> azentrius.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.azentrius.com;
    access_log /var/log/nginx/azentrius.com.access.log anonymized;
    log_not_found off;

    ssl_certificate     /etc/letsencrypt/live/azentrius.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azentrius.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://azentrius.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azentrius.com;
    access_log /var/log/nginx/azentrius.com.access.log anonymized;
    log_not_found off;

    ssl_certificate     /etc/letsencrypt/live/azentrius.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azentrius.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The live release: azentrius-website switches "current" to a verified release (deploy/).
    root /var/www/azentrius-website/current;
    index index.html;
    error_page 404 /404.html;

    # A folder without its slash ("/stellwerk") is redirected to "/stellwerk/" by nginx itself,
    # with a relative Location header.
    absolute_redirect off;

    # Headers for every answer. nginx drops these in any location that sets add_header itself, so
    # the locations below only use "expires", which does not. The site has no inline scripts or
    # styles (scripts/check-dist.mjs), so the policy needs no 'unsafe-inline'.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://analytics.azentrius.com; connect-src https://analytics.azentrius.com; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Built files carry a hash in their name: cache for a year.
    location /_astro/ {
        expires 1y;
    }
    location /fonts/ {
        expires 30d;
    }
    # Pages: always ask whether there is a newer version.
    location / {
        expires epoch;
    }

    # Addresses of the previous site.
    location = /impressum.html { return 301 /de/impressum/; }
    location = /datenschutz.html { return 301 /de/datenschutz/; }
    location = /sitemap.xml { return 301 /sitemap-index.xml; }
}
