# azentrius.com on nginx: the lines that belong inside the existing "server { listen 443 ssl; ... }"
# block for azentrius.com. Certificates, listen and server_name stay as they are on the server.
# Not active yet. See deploy/README.md for how a release gets onto the server.

# A release is unpacked to /var/www/azentrius.com/releases/VERSION; "current" points at the live one.
root /var/www/azentrius.com/current;
index index.html;
error_page 404 /404.html;

# A folder without its slash ("/stellwerk") is redirected to "/stellwerk/" by nginx itself.
# Relative Location headers, so the redirect never names another host or port.
absolute_redirect off;

# Headers for every answer, next to the Strict-Transport-Security header the server already sends
# (keep that one as it is). nginx drops these in any location that sets add_header itself, so the
# locations below use "expires" for caching, which does not.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://analytics.azentrius.com; connect-src https://analytics.azentrius.com; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Built files carry a hash in their name: cache for a year.
location /_astro/ {
    expires 1y;
}
location /fonts/ {
    expires 30d;
}
# Pages: always ask whether there is a newer version.
location / {
    expires epoch;
}

# Addresses of the previous site.
location = /impressum.html { return 301 /de/impressum/; }
location = /datenschutz.html { return 301 /de/datenschutz/; }

# Keep the server's existing location for /.well-known/acme-challenge/ as it is, so certificate
# renewal goes on working; it must not point into "current".
